<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>redpen — README 영상 무대</title>
<!--
  1920×1080 캔버스. render.mjs가 window.setup(lang, clip) → window.renderAt(t)로 프레임마다 찍는다.
  모든 상태는 t만으로 정해진다(CSS 애니메이션·트랜지션 없음).
  녹화: /rec/<lang>/<clip>/fNNNNN.jpg + manifest.json (record.mjs). 글꼴: /fonts/ (examples/showcase/fonts).
  디자인: 예제 덱과 같은 회색조 + 포인트 #AE1F24.
-->
<style>
@font-face { font-family: "Geist"; src: url("fonts/Geist-Variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Geist Mono"; src: url("fonts/GeistMono-Variable.woff2") format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Pretendard"; src: url("fonts/Pretendard-Light.subset.woff2") format("woff2"); font-weight: 300; }
@font-face { font-family: "Pretendard"; src: url("fonts/Pretendard-Regular.subset.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Pretendard"; src: url("fonts/Pretendard-Medium.subset.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: "Pretendard"; src: url("fonts/Pretendard-SemiBold.subset.woff2") format("woff2"); font-weight: 600; }
:root {
  --paper:#fafafa; --white:#fff; --hairline:#ebebeb; --ash:#c9c9c9; --smoke:#a8a8a8; --graphite:#8f8f8f;
  --stone:#666; --charcoal:#4d4d4d; --ink:#171717; --accent:#AE1F24; --accent-soft:#f6e7e8;
  --sans: "Geist", "Pretendard", "Apple SD Gothic Neo", sans-serif;
  --mono: "Geist Mono", "Pretendard", ui-monospace, monospace;
}
* { box-sizing: border-box; }
html, body { margin:0; width:1920px; height:1080px; overflow:hidden; background:var(--paper); }
body { font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased; font-feature-settings:"calt" 0,"rlig","ss11"; word-break:keep-all; }
#stage { position:absolute; inset:0; overflow:hidden; background:var(--paper); }
.layer { position:absolute; inset:0; }
.hidden { display:none !important; }
b { font-weight:600; }

/* ---------- 머리·바닥 ---------- */
.eyebrow { font-family:var(--mono); font-size:16px; letter-spacing:.071em; text-transform:uppercase; color:var(--ink); display:flex; gap:14px; align-items:center; }
.eyebrow .dot { width:9px; height:9px; border-radius:50%; background:var(--accent); }
.foot { position:absolute; left:0; right:0; bottom:0; height:52px; border-top:1px solid var(--hairline); display:flex; align-items:center; gap:24px; padding:0 48px; font-family:var(--mono); font-size:13px; letter-spacing:.071em; text-transform:uppercase; color:var(--graphite); background:var(--paper); }
.foot b { color:var(--ink); font-weight:600; }
.foot .pen { color:var(--accent); }
.foot .sp { flex:1; }
.prog { position:absolute; left:0; bottom:51px; height:3px; background:var(--accent); width:0; }

/* ---------- 녹화 장면 ---------- */
.rail { position:absolute; left:48px; top:44px; width:288px; bottom:120px; }
.rail .ch { font-family:var(--mono); font-size:15px; letter-spacing:.071em; text-transform:uppercase; color:var(--stone); }
.rail h2 { font-size:38px; font-weight:500; letter-spacing:-.03em; margin:10px 0 0; line-height:1.15; }
.rail ol { list-style:none; margin:34px 0 0; padding:0; position:relative; }
.rail li { height:52px; display:flex; align-items:center; gap:14px; font-size:22px; color:var(--ash); padding-left:18px; }
.rail li i { font-style:normal; font-family:var(--mono); font-size:14px; width:24px; color:inherit; letter-spacing:.04em; }
.rail li.done { color:var(--stone); }
.rail li.cur { color:var(--ink); font-weight:500; }
.rail .bar { position:absolute; left:0; width:3px; height:32px; background:var(--accent); border-radius:2px; }
.rail .note { position:absolute; left:0; bottom:0; font-family:var(--mono); font-size:13px; letter-spacing:.06em; color:var(--graphite); line-height:1.7; text-transform:uppercase; }
.rail .note span { display:block; text-transform:none; letter-spacing:0; font-family:var(--sans); font-size:15px; color:var(--stone); }
.toptag { position:absolute; right:48px; top:14px; font-family:var(--mono); font-size:13px; letter-spacing:.071em; text-transform:uppercase; color:var(--graphite); }
.frame { position:absolute; left:368px; top:44px; width:1504px; height:846px; overflow:hidden; border-radius:10px; background:#fff;
  box-shadow: 0 0 0 1px rgba(0,0,0,.09), 0 18px 48px rgba(0,0,0,.07); }
.cam { position:absolute; left:0; top:0; width:1920px; height:1080px; transform-origin:0 0; }
.cam img { position:absolute; left:0; top:0; width:1920px; height:1080px; display:block; }
.fx { position:absolute; inset:0; pointer-events:none; }
.cursor { position:absolute; width:30px; height:30px; margin:-3px 0 0 -4px; opacity:0; transform-origin:4px 3px; }
.ripple { position:absolute; border:3px solid var(--accent); border-radius:50%; opacity:0; }
.keycap { position:absolute; left:28px; bottom:28px; display:flex; align-items:center; gap:16px; padding:10px 22px 10px 10px; border-radius:14px; background:var(--ink); color:#fff; opacity:0; transform-origin:0 100%;
  box-shadow:0 14px 34px rgba(0,0,0,.22); }
.keycap .k { min-width:54px; height:54px; padding:0 14px; border-radius:9px; background:#fff; color:var(--ink); font-family:var(--mono); font-size:28px; font-weight:500; display:flex; align-items:center; justify-content:center; box-shadow:inset 0 -3px 0 #d9d9d9; }
.keycap.accent .k { background:var(--accent); color:#fff; box-shadow:inset 0 -3px 0 #7d1519; }
.keycap .l { font-size:24px; font-weight:500; letter-spacing:-.01em; }
.term { position:absolute; right:30px; bottom:30px; width:720px; border-radius:12px; overflow:hidden; background:#151515; opacity:0;
  box-shadow:0 0 0 1px rgba(0,0,0,.4), 0 30px 80px rgba(0,0,0,.35); }
.term .tb { height:40px; display:flex; align-items:center; gap:9px; padding:0 16px; background:#232323; font-family:var(--mono); font-size:13px; letter-spacing:.06em; color:#9a9a9a; text-transform:uppercase; }
.term .tb i { width:11px; height:11px; border-radius:50%; background:#444; display:inline-block; }
.term .tb span { margin-left:8px; }
.term pre { margin:0; padding:20px 24px 24px; font-family:var(--mono); font-size:18px; line-height:1.62; color:#e8e8e8; white-space:pre-wrap; word-break:break-all; min-height:300px; }
.term pre .p { color:#d4787c; }
.term pre .d { color:#8a8a8a; }
.term pre .ok { color:#7fd18b; }
.term pre .h { color:#fff; font-weight:600; }
.cap { position:absolute; left:368px; top:908px; width:1504px; height:110px; display:flex; align-items:center; gap:34px; opacity:0; }
.cap .t { flex:0 0 auto; min-width:330px; }
.cap .n { font-family:var(--mono); font-size:15px; letter-spacing:.071em; color:var(--stone); text-transform:uppercase; }
.cap .h { font-size:42px; font-weight:500; letter-spacing:-.03em; line-height:1.15; margin-top:6px; white-space:nowrap; }
.cap .d { flex:1 1 auto; border-left:1px solid var(--hairline); padding-left:34px; font-size:27px; line-height:1.45; color:var(--charcoal); }
.cap .d b { color:var(--accent); font-family:var(--mono); font-weight:500; }
.intro { position:absolute; inset:0; z-index:50; background:var(--paper); padding:0 112px; display:flex; flex-direction:column; justify-content:center; }
.intro .big { font-family:var(--mono); font-size:150px; line-height:1; letter-spacing:-.02em; color:var(--ink); font-weight:300; margin-top:40px; }
.intro .big em { font-style:normal; color:var(--accent); }
.intro h1 { font-size:76px; font-weight:500; letter-spacing:-.04em; margin:28px 0 0; line-height:1.1; }
.intro p { font-size:30px; color:var(--charcoal); margin:22px 0 0; line-height:1.5; }

</style>
</head>
<body>
<div id="stage"></div>
<script>
"use strict";
/* ---------------- 공통 ---------------- */
const FPS = 30;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (x) => { x = clamp(x, 0, 1); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = (x) => { x = clamp(x, 0, 1); return 1 - Math.pow(1 - x, 3); };
const easeBack = (x) => { x = clamp(x, 0, 1); const c = 1.6; return 1 + (c + 1) * Math.pow(x - 1, 3) + c * Math.pow(x - 1, 2); };
const prog = (t, a, d) => clamp((t - a) / d, 0, 1);
const $ = (s, r = document) => r.querySelector(s);
const h = (html) => { const d = document.createElement("div"); d.innerHTML = html.trim(); return d.firstElementChild; };
function reveal(el, t, a, d = .5, dy = 18) { const k = easeOut(prog(t, a, d)); el.style.opacity = k; el.style.transform = `translateY(${(1 - k) * dy}px)`; return k; }

/* ---------------- 문구 ---------------- */
const COPY = {
  ko: {
    brand: "빨간펜", what: "HTML 슬라이드 리뷰", top: "REDPEN · 실제 화면 녹화", total: "04",
    note: ["Real screen", "예제 덱 · examples/showcase", "빨간펜 실제 동작 그대로"],
    keys: { D: "삭제", R: "수정", C: "코멘트", Enter: "저장" },
    term: "Claude Code · 같은 세션",
    ch: {
      "01": { name: "텍스트 고치기", lead: "드래그하고, 키 하나로 표시합니다.",
        steps: [["지우기", "지울 문장을 드래그하고 <b>D</b>. 바로 취소선이 그어집니다."], ["바꾸기", "바꿀 곳을 드래그하고 <b>R</b>, 새 문구를 입력합니다."], ["코멘트", "지시가 필요하면 <b>C</b>. 그 자리에 메모가 남습니다."]] },
      "02": { name: "레이아웃 바꾸기", lead: "끌어서 옮기고, 모서리로 키웁니다.",
        steps: [["요소 선택", "레이아웃 모드에서 카드·이미지·글 상자를 클릭합니다."], ["순서 바꾸기", "다른 칸 위에 놓으면 그 자리로 들어갑니다. 원래 자리는 보라색으로 남습니다."], ["크기와 글자", "모서리를 끌어 키우고, 막대의 <b>+</b>로 글자를 키웁니다."]] },
      "03": { name: "영역과 슬라이드", lead: "빈 공간과 슬라이드 전체에도 지시합니다.",
        steps: [["빈 공간에 지시", "영역 모드로 범위를 그리고 할 일을 적습니다."], ["새 배치 스케치", "칸을 그려 슬라이드를 어떻게 다시 짤지 보여 줍니다."], ["슬라이드 통째로", "슬라이드 메뉴에서 삭제나 순서 옮기기를 표시합니다."]] },
      "04": { name: "AI에게 보내기", lead: "표시가 그대로 AI 세션에 전달되고, 고친 화면이 다시 열립니다.",
        steps: [["모아 보기", "표시한 내용이 슬라이드별로 모입니다."], ["보내기", "버튼 하나로, HTML을 만들던 그 AI 세션에 전달됩니다."], ["AI가 원문 수정", "슬라이드 번호·원문·소스 위치를 받아 바로 고칩니다."], ["다시 확인", "화면이 저절로 새로고침되고, AI의 답장이 뜹니다."]] },
    },
  },
  en: {
    brand: "Redpen", what: "HTML slide review", top: "REDPEN · REAL SCREEN RECORDING", total: "04",
    note: ["Real screen", "Example deck · examples/showcase", "Redpen exactly as it works"],
    keys: { D: "Delete", R: "Replace", C: "Comment", Enter: "Save" },
    term: "Claude Code · same session",
    ch: {
      "01": { name: "Fix text", lead: "Drag over it, then one key.",
        steps: [["Delete", "Drag over a sentence and press <b>D</b>. It is struck through right away."], ["Replace", "Drag over the words, press <b>R</b> and type the new text."], ["Comment", "Need an instruction? Press <b>C</b> and it stays right there."]] },
      "02": { name: "Change the layout", lead: "Drag to move, pull a corner to resize.",
        steps: [["Select", "In Layout mode, click a card, image or text box."], ["Reorder", "Drop it on another slot and it takes that place. Its old spot stays in purple."], ["Size and font", "Pull a corner to enlarge, and <b>+</b> in the bar for bigger text."]] },
      "03": { name: "Areas and slides", lead: "Give instructions for empty space and whole slides.",
        steps: [["Empty space", "In Area mode, draw a box and write what to do."], ["Layout sketch", "Draw boxes to show how the slide should be rebuilt."], ["Whole slide", "Mark a slide for deletion or a move from the slide menu."]] },
      "04": { name: "Send to AI", lead: "Your marks reach the AI session, and the fixed page comes back.",
        steps: [["Review", "Every mark is listed, slide by slide."], ["Send", "One button sends it to the AI session that made the HTML."], ["AI edits the source", "With slide numbers, original text and source lines, it fixes it directly."], ["Check again", "The page reloads by itself and the AI's reply pops up."]] },
    },
  },
};

/* ---------------- 녹화 ---------------- */
let M = null; // manifest
function frameAt(rt) {
  const fr = M.frames; let lo = 0, hi = fr.length - 1;
  if (rt <= fr[0].t) return fr[0];
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (fr[mid].t <= rt) lo = mid; else hi = mid - 1; }
  return fr[lo];
}
function cursorAt(rt) {
  const ev = M.cursor; if (!ev.length) return { x: 960, y: 540 };
  if (rt <= ev[0].t) return ev[0];
  let lo = 0, hi = ev.length - 1;
  while (lo < hi) { const mid = (lo + hi + 1) >> 1; if (ev[mid].t <= rt) lo = mid; else hi = mid - 1; }
  const a = ev[lo], b = ev[lo + 1];
  if (b && b.t - a.t < 80) { const k = (rt - a.t) / (b.t - a.t); return { x: lerp(a.x, b.x, k), y: lerp(a.y, b.y, k) }; }
  return a;
}
const markAt = (name) => M.events.find((e) => e.type === "mark" && e.name === name)?.t;

/* ---------------- 카메라 ---------------- */
const FR = { x: 368, y: 44, w: 1504, h: 846 };
const S0 = FR.w / 1920;
function camFix(c) { const z = Math.max(1, c.z); const hw = 1920 / (2 * z), hh = 1080 / (2 * z); return { z, x: clamp(c.x, hw, 1920 - hw), y: clamp(c.y, hh, 1080 - hh) }; }
function camFor(e) {
  const [x, y, w, hgt] = e.rect;
  const z = e.z ?? clamp(Math.min(1920 / w, 1080 / hgt) * .92, 1, 1.85);
  return camFix({ z, x: x + w / 2, y: y + hgt / 2 });
}
function camAt(rt) {
  const keys = M.focus; let c = { z: 1, x: 960, y: 540 };
  for (let i = 0; i < keys.length; i++) {
    const k = keys[i]; const start = k.t - 150, dur = 650;
    if (rt < start) break;
    const target = camFor(k);
    if (rt >= start + dur) { c = target; continue; }
    const e = ease((rt - start) / dur);
    c = camFix({ z: Math.exp(lerp(Math.log(c.z), Math.log(target.z), e)), x: lerp(c.x, target.x, e), y: lerp(c.y, target.y, e) });
    break;
  }
  return c;
}
const toFrame = (p, c) => ({ x: FR.w / 2 + (p.x - c.x) * S0 * c.z, y: FR.h / 2 + (p.y - c.y) * S0 * c.z });
const camTransform = (c) => { const s = S0 * c.z; return `translate(${FR.w / 2 - c.x * s}px, ${FR.h / 2 - c.y * s}px) scale(${s})`; };

/* ---------------- 장면: 녹화 ---------------- */
let C = null; let LANG = "ko"; const stage = document.getElementById("stage");
const INTRO = 1.7, XF = .45, END = 1.1;

function footer(no, name) {
  const P = COPY[LANG];
  return `<div class="foot"><span><b class="pen">✒</b> <b>REDPEN</b>${LANG === "ko" ? ` ${P.brand}` : ""} · ${P.what}</span><span class="sp"></span><span>${no} / ${P.total} ${name}</span></div><div class="prog"></div>`;
}

function buildFootage(clip) {
  const P = COPY[LANG]; const ch = P.ch[clip];
  const marks = M.events.filter((e) => e.type === "mark");
  const s1 = markAt("s1") ?? 0;
  C.recStart = Math.max(0, s1 - 500); C.recEnd = markAt("end") ?? M.frames.at(-1).t;
  C.speed = C.speed || { "01": 1.3, "02": 1.25, "03": 1.5, "04": 1.15 }[clip] || 1.25;
  C.f0 = INTRO - XF;
  C.duration = C.f0 + (C.recEnd - C.recStart) / 1000 / C.speed + END;
  // 단계: s1, s2 … 의 녹화 시각
  C.stepT = ch.steps.map((_, i) => markAt(`s${i + 1}`) ?? Infinity);
  stage.innerHTML = `
    <div class="layer chrome">
      <div class="rail"><div class="ch">${clip} / ${P.total}</div><h2>${ch.name}</h2>
        <ol>${ch.steps.map((s, i) => `<li><i>${String(i + 1).padStart(2, "0")}</i>${s[0]}</li>`).join("")}<div class="bar"></div></ol>
        <div class="note">${P.note[0]}<span>${P.note[1]}</span><span>${P.note[2]}</span></div></div>
      <div class="toptag">${P.top}</div>
      <div class="frame"><div class="cam" id="cam"><img></div><div class="fx" id="fx"></div></div>
      <div class="cap" id="capB"><div class="t"><div class="n"></div><div class="h"></div></div><div class="d"></div></div>
      <div class="cap" id="capA"><div class="t"><div class="n"></div><div class="h"></div></div><div class="d"></div></div>
      ${footer(clip, ch.name)}
    </div>
    <div class="intro"><div class="eyebrow"><span class="dot"></span><span>REDPEN${LANG === "ko" ? ` · ${P.brand}` : ""}</span></div><div class="big">${clip}</div><h1>${ch.name}</h1><p>${ch.lead}</p></div>`;
  const fx = $("#fx");
  C.ripple = h(`<div class="ripple"></div>`); fx.append(C.ripple);
  C.keycap = h(`<div class="keycap"><div class="k"></div><div class="l"></div></div>`); fx.append(C.keycap);
  C.term = h(`<div class="term"><div class="tb"><i></i><i></i><i></i><span>${P.term}</span></div><pre></pre></div>`); fx.append(C.term);
  C.cursor = h(`<svg class="cursor" viewBox="0 0 26 26"><path d="M4 2.5 L4 21 L9 16.6 L12.4 24 L15.6 22.6 L12.3 15.4 L19 15.4 Z" fill="#111" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg>`); fx.append(C.cursor);
}

async function setImg(img, src) { if (img.getAttribute("src") !== src) { img.setAttribute("src", src); try { await img.decode(); } catch (e) { } } }

function termText(rt) {
  const ev = M.events.find((e) => e.type === "terminal"); if (!ev) return null;
  const P = COPY[LANG];
  const edit = M.events.find((e) => e.type === "edit"), back = markAt("reloaded");
  // what the AI receives: the header, the request count, the slide and one line per mark
  const keep = (l) => /^# |^- (요청|Requests):|^## (슬라이드|Slide) |^### /.test(l);
  const raw = ev.text.split("\n").filter(keep).slice(0, 7);
  const lines = [`<span class="p">❯</span> <span class="d">redpen wait ${LANG === "ko" ? "index.html" : "en.html"}</span>`,
    ...raw.map((l) => /^#{1,3} /.test(l) ? `<span class="h">${esc(l)}</span>` : esc(l))];
  const age = rt - ev.t; const shown = Math.floor(clamp(age / 260, 0, lines.length));
  const out = lines.slice(0, shown);
  if (edit && rt >= edit.t - 900) out.push("", `<span class="ok">⏺</span> Update(${esc(edit.file)})`);
  if (edit && rt >= edit.t) out.push(`  <span class="d">⎿</span> ${LANG === "ko" ? "3건 반영" : "3 marks applied"}`);
  return { html: out.join("\n"), from: ev.t, to: (back ?? Infinity) + 600 };
}
const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

async function renderFootage(T) {
  const P = COPY[LANG]; const ch = P.ch[C.clip];
  const intro = $(".intro");
  const io = 1 - prog(T, INTRO - .5, .5);
  intro.style.opacity = io; intro.classList.toggle("hidden", io <= 0);
  [...intro.children].forEach((c, i) => reveal(c, T, .05 + i * .1, .5, 16));
  $(".prog").style.width = `${clamp(T / C.duration, 0, 1) * 1920}px`;
  const rt = clamp(C.recStart + (T - C.f0) * C.speed * 1000, C.recStart, C.recEnd);
  const cam = camAt(rt);
  const camEl = $("#cam");
  const wait = setImg($("img", camEl), `rec/${LANG}/${C.clip}/${frameAt(rt).f}`);
  camEl.style.transform = camTransform(cam);
  // 커서·클릭
  const cp = toFrame(cursorAt(rt), cam);
  const downs = M.events.filter((e) => e.type === "down" || e.type === "up");
  let pressed = false; for (const e of downs) { if (e.t <= rt) pressed = e.type === "down"; }
  const vis = T > C.f0 + .1 ? 1 : 0;
  Object.assign(C.cursor.style, { left: `${cp.x}px`, top: `${cp.y}px`, opacity: vis, transform: `scale(${pressed ? .86 : 1})`, zIndex: 9 });
  let rip = 0;
  for (const c of M.events) {
    if (c.type !== "click" && c.type !== "down") continue;
    const age = (rt - c.t) / 1000; if (age < 0 || age > .55) continue;
    const p = toFrame(c, cam); const r = lerp(8, 38, easeOut(age / .55));
    Object.assign(C.ripple.style, { left: `${p.x - r}px`, top: `${p.y - r}px`, width: `${2 * r}px`, height: `${2 * r}px`, opacity: (1 - age / .55) * .9 }); rip = 1;
  }
  if (!rip) C.ripple.style.opacity = 0;
  // 키 배지
  let kshow = 0;
  for (const k of M.events) {
    if (k.type !== "key") continue;
    const age = (rt - k.t) / 1000; if (age < -.05 || age > 1.25) continue;
    const a = Math.min(easeOut((age + .05) / .18), 1 - prog(age, .95, .3));
    $(".k", C.keycap).textContent = k.key === "Enter" ? "↵" : k.key;
    $(".l", C.keycap).textContent = P.keys[k.key] || k.key;
    C.keycap.classList.toggle("accent", k.key !== "Enter");
    C.keycap.style.opacity = a; C.keycap.style.transform = `scale(${lerp(.86, 1, easeBack(prog(age, -.05, .25)))})`; kshow = 1;
  }
  if (!kshow) C.keycap.style.opacity = 0;
  // 터미널(04)
  const tt = termText(rt);
  if (tt && rt >= tt.from && rt <= tt.to + 400) {
    const a = Math.min(easeOut((rt - tt.from) / 350), 1 - prog(rt, tt.to, 400));
    $("pre", C.term).innerHTML = tt.html; C.term.style.opacity = a; C.term.style.transform = `translateY(${(1 - a) * 16}px)`;
  } else C.term.style.opacity = 0;
  // 단계(레일·자막)
  let step = 0; for (let i = 0; i < C.stepT.length; i++) if (rt >= C.stepT[i] - 120) step = i;
  const items = [...document.querySelectorAll(".rail li")];
  items.forEach((li, i) => { li.className = i < step ? "done" : i === step ? "cur" : ""; });
  const outT = (r) => C.f0 + (r - C.recStart) / 1000 / C.speed; // 녹화 시각 → 출력 시각
  const st0 = outT(C.stepT[step] - 120); const prevStep = Math.max(0, step - 1);
  const kb = ease(prog(T, st0, .45));
  $(".rail .bar").style.top = `${lerp(prevStep * 52 + 10, step * 52 + 10, step === 0 ? 1 : kb)}px`;
  const capA = $("#capA"), capB = $("#capB");
  const fill = (el, i) => { $(".n", el).textContent = `Step ${String(i + 1).padStart(2, "0")} / ${String(ch.steps.length).padStart(2, "0")}`; $(".h", el).textContent = ch.steps[i][0]; $(".d", el).innerHTML = ch.steps[i][1]; };
  const swapping = step > 0 && T - st0 < .2;
  fill(capA, step); const kc = easeOut(prog(T, step > 0 ? st0 + .2 : INTRO - .6, .35));
  capA.style.opacity = swapping ? 0 : kc; capA.style.transform = `translateY(${(1 - kc) * 12}px)`;
  if (swapping) { fill(capB, prevStep); capB.style.opacity = 1 - (T - st0) / .2; capB.style.transform = "none"; } else capB.style.opacity = 0;
  await wait;
}

/* ---------------- 진입점 ---------------- */
window.setup = async function (lang, clip, opts = {}) {
  LANG = lang; document.documentElement.lang = lang;
  C = { clip, ...opts };
  for (const f of ['500 40px "Pretendard"', '400 20px "Pretendard"', '300 20px "Pretendard"', '600 20px "Pretendard"', '400 16px "Geist Mono"', '500 40px "Geist"']) await document.fonts.load(f);
  M = await (await fetch(`rec/${lang}/${clip}/manifest.json`)).json();
  M.cursor = M.events.filter((e) => e.type === "cursor" || e.type === "click" || e.type === "down" || e.type === "up");
  M.focus = M.events.filter((e) => e.type === "focus");
  buildFootage(clip);
  await document.fonts.ready;
  return { duration: C.duration, frames: Math.round(C.duration * FPS) };
};
window.renderAt = async function (t) { await renderFootage(t); return true; };
</script>
